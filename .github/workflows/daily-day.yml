name: Update day title daily
on:
  schedule:
    - cron: '20 15 * * *'   # 17:20 Israel time, just after nightfall (Haifa)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bake current day into static HTML
        run: |
          python3 - <<'PY'
          import re, datetime
          starts = ['2026-11-22T17:15:00+02:00','2026-11-23T17:14:00+02:00','2026-11-24T17:14:00+02:00',
                    '2026-11-25T17:14:00+02:00','2026-11-26T17:14:00+02:00','2026-11-27T17:14:00+02:00',
                    '2026-11-28T17:14:00+02:00','2026-11-29T17:13:00+02:00','2026-11-30T17:13:00+02:00',
                    '2026-12-01T17:13:00+02:00','2026-12-02T17:13:00+02:00','2026-12-03T17:13:00+02:00',
                    '2026-12-04T17:13:00+02:00']
          starts = [datetime.datetime.fromisoformat(x) for x in starts]
          end = datetime.datetime.fromisoformat('2026-12-05T17:13:00+02:00')
          now = datetime.datetime.now(datetime.timezone.utc)
          day = 0
          for i, s in enumerate(starts):
              if now >= s: day = i + 1
          if now >= end or not (1 <= day <= 13):
              print('outside cycle, day', day); raise SystemExit(0)
          heb = ['יג','יד','טו','טז','יז','יח','יט','כ','כא','כב','כג','כד','כה']
          s = open('index.html', encoding='utf-8').read()
          s, n1 = re.subn(r'<title>תהילים י״ג · [^<]* כסלו · יום \d+</title>', f'<title>תהילים י״ג · {heb[day-1]} כסלו · יום {day}</title>', s)
          s, n2 = re.subn(r'<h2 id="date">[^<]* כסלו</h2>', f'<h2 id="date">{heb[day-1]} כסלו</h2>', s)
          s, n3 = re.subn(r'<div class="day-number" id="dayLabel">יום \d+</div>', f'<div class="day-number" id="dayLabel">יום {day}</div>', s)
          print('replacements:', n1, n2, n3, 'day', day)
          assert n1 == 1 and n2 == 1 and n3 == 1
          open('index.html', 'w', encoding='utf-8').write(s)
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Daily title: bake current day"
          git push
